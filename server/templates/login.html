<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - HwMon 硬件监控系统</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
:root{--bg-deepest:#0a0c14;--bg-card:rgba(21,24,35,.85);--border:#2a2f45;--text-primary:#e8ecf4;--text-secondary:#8b92a8;--text-muted:#5a6178;--accent:#00e5a0;--accent-dim:rgba(0,229,160,.15);--radius:8px;--radius-lg:12px;--transition:.25s cubic-bezier(.4,0,.2,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg-deepest);color:var(--text-primary);min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(0,229,160,.08) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(77,171,247,.06) 0%,transparent 50%),var(--bg-deepest)}
.bg::before{content:'';position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:.15}
.card{position:relative;z-index:1;width:420px;max-width:90vw;background:var(--bg-card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--radius-lg);padding:48px 40px;box-shadow:0 25px 60px rgba(0,0,0,.4)}
.logo{text-align:center;margin-bottom:36px}
.logo .icon{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#00b880);margin-bottom:16px;box-shadow:0 8px 30px rgba(0,229,160,.25)}
.logo .icon i{font-size:28px;color:#fff}
.logo h1{font-size:24px;font-weight:700;font-family:'JetBrains Mono','Noto Sans SC',sans-serif}
.logo p{color:var(--text-secondary);font-size:14px;margin-top:6px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:8px}
.form-input{width:100%;height:44px;padding:0 14px;background:#0a0c14;border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-size:14px;font-family:inherit;transition:var(--transition);outline:none}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.form-input::placeholder{color:var(--text-muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:var(--transition);background:linear-gradient(135deg,var(--accent),#00c08a);color:#0a0c14;box-shadow:0 4px 15px rgba(0,229,160,.25);margin-top:8px}
.btn:hover{box-shadow:0 6px 25px rgba(0,229,160,.35);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.error{background:rgba(255,77,106,.15);color:#ff4d6a;padding:12px;border-radius:var(--radius);margin-bottom:20px;font-size:13px;display:none}
.error.show{display:block}
.footer{text-align:center;margin-top:24px;color:var(--text-muted);font-size:12px;font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="logo">
    <div class="icon"><i class="fas fa-microchip"></i></div>
    <h1>HwMon</h1>
    <p>硬件监控系统 v5.0</p>
  </div>
  <div class="error" id="errMsg"></div>
  <form id="loginForm">
    <div class="form-group"><label>用户名</label><input type="text" class="form-input" id="username" placeholder="请输入用户名" required autocomplete="username"></div>
    <div class="form-group"><label>密码</label><input type="password" class="form-input" id="password" placeholder="请输入密码" required autocomplete="current-password"></div>
    <button type="submit" class="btn" id="loginBtn"><span id="btnText">登录</span></button>
  </form>
  <div class="footer">HwMon Server v5.0.0-20260526</div>
</div>
<script>
const form=document.getElementById('loginForm'),err=document.getElementById('errMsg'),btn=document.getElementById('loginBtn'),txt=document.getElementById('btnText');
function showErr(m){err.textContent=m;err.classList.add('show');setTimeout(()=>err.classList.remove('show'),3000);}
async function checkLogin(){try{const r=await fetch('/api/check-login');const d=await r.json();if(d.logged_in)window.location.href='/';}catch(e){}}
checkLogin();
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;
  if(!u||!p){showErr('请输入用户名和密码');return;}
  btn.disabled=true;txt.innerHTML='<i class="fas fa-spinner fa-spin"></i> 登录中...';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(d.status==='success'){txt.textContent='登录成功！';setTimeout(()=>window.location.href='/',500);}
    else{showErr(d.message||'登录失败');btn.disabled=false;txt.textContent='登录';}
  }catch(e){showErr('网络错误');btn.disabled=false;txt.textContent='登录';}
});
document.getElementById('password').addEventListener('keypress',e=>{if(e.key==='Enter')form.dispatchEvent(new Event('submit'));});
</script>
</body>
</html>
